<text x="450.0" y="23" text-anchor="middle" fill="#64748b" style="font-size:12.5px">kiro-a2a: your A2A agents in Kiro</text>
<text class="l0" x="22" y="62"><tspan fill="#7c3aed">$ </tspan><tspan fill="#0f172a">pip install kiro-a2a-bridge</tspan></text><rect class="w0" x="22" y="47" width="250" height="21" fill="#ffffff" transform="translate(250 0)"/><text class="l1" x="22" y="83"><tspan fill="#64748b">Successfully installed kiro-a2a-bridge</tspan></text><text class="l2" x="22" y="104"><tspan fill="#7c3aed">$ </tspan><tspan fill="#0f172a">kiro-a2a add orchestrator http://localhost:9100 --global</tspan></text><rect class="w2" x="22" y="89" width="495" height="21" fill="#ffffff" transform="translate(495 0)"/><text class="l3" x="22" y="125"><tspan fill="#64748b">added agent &#x27;orchestrator&#x27; in ~/.kiro/a2a-agents.json</tspan></text><text class="l4" x="22" y="146"><tspan fill="#64748b">set MCP server &#x27;orchestrator&#x27; in ~/.kiro/settings/mcp.json</tspan></text><text class="l5" x="22" y="167"><tspan fill="#1e293b">In Kiro, the tool is </tspan><tspan fill="#0d9488">ask_orchestrator</tspan></text><text class="l6" x="22" y="188"><tspan fill="#7c3aed">$ </tspan><tspan fill="#0f172a">kiro-a2a doctor</tspan></text><rect class="w6" x="22" y="173" width="149" height="21" fill="#ffffff" transform="translate(149 0)"/><text class="l7" x="22" y="209"><tspan fill="#16a34a">  [ok  ] </tspan><tspan fill="#1e293b">agent card: Team Orchestrator (streaming: yes)</tspan></text><text class="l8" x="22" y="230"><tspan fill="#16a34a">  [ok  ] </tspan><tspan fill="#1e293b">sign-in: oauth2, authorization_code</tspan></text><text class="l9" x="22" y="251"><tspan fill="#7c3aed">$ </tspan><tspan fill="#0f172a">kiro-a2a ask orchestrator &quot;calculate (12 + 30) * 2 and then uppercase: hello team&quot;</tspan></text><rect class="w9" x="22" y="236" width="714" height="21" fill="#ffffff" transform="translate(714 0)"/><text class="l10" x="22" y="272"><tspan fill="#7c3aed">◆ </tspan><tspan fill="#0f172a">Team Orchestrator</tspan><tspan fill="#64748b">  A2A 1.0 · http://localhost:9100/</tspan></text><text class="l11" x="22" y="293"><tspan fill="#64748b">  · </tspan><tspan fill="#64748b">orchestrator: plan = [&#x27;calculator&#x27;, &#x27;text-tools&#x27;]</tspan></text><text class="l12" x="22" y="314"><tspan fill="#64748b">  · </tspan><tspan fill="#64748b">orchestrator: asking calculator over A2A</tspan></text><text class="l13" x="22" y="335"><tspan fill="#64748b">  · </tspan><tspan fill="#64748b">  calculator: expression is &#x27;(12 + 30) * 2&#x27;</tspan></text><text class="l14" x="22" y="356"><tspan fill="#64748b">  · </tspan><tspan fill="#64748b">orchestrator: asking text-tools over A2A</tspan></text><text class="l15" x="22" y="377"><tspan fill="#64748b">  · </tspan><tspan fill="#64748b">  text-tools: operation &#x27;uppercase&#x27;</tspan></text><text class="l16" x="22" y="398"><tspan fill="#1e293b">Results from my sub-agents:</tspan></text><text class="l17" x="22" y="419"><tspan fill="#1e293b">- calculator: (12 + 30) * 2 = </tspan><tspan fill="#0d9488">84</tspan></text><text class="l18" x="22" y="440"><tspan fill="#1e293b">- text-tools: uppercase: </tspan><tspan fill="#0d9488">HELLO TEAM</tspan></text><text class="l19" x="22" y="461"><tspan fill="#16a34a">✓ completed</tspan><tspan fill="#64748b"> · 0.4s</tspan></text><text class="l20" x="22" y="482"><tspan fill="#64748b">  follow up: kiro-a2a ask orchestrator &quot;...&quot; --context-id 86e4c892</tspan></text>
</svg>
