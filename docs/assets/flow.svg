<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-label="One request from Kiro through kiro-a2a to a parent agent and its sub-agent, with live progress, a question for you, your answer, and the final result">
<defs><marker id="mreq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7c3aed"/></marker><marker id="mback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0d9488"/></marker><marker id="mask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d97706"/></marker>
<style>
text{font-family:'Segoe UI',Inter,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}
.h1{font-size:24px;font-weight:700} .sub{font-size:14px;fill:#64748b} .who{font-size:14.5px;font-weight:700}
.m{font-size:12.5px;font-weight:600} .n{font-size:11px;font-weight:700;fill:#ffffff} .lg text{font-size:12px;fill:#475569}
@keyframes s0{0%,3.75%{opacity:0}5.94%,93.75%{opacity:1}100%{opacity:0}}.s0{animation:s0 16.0s ease-out infinite}@keyframes s1{0%,9.38%{opacity:0}11.56%,93.75%{opacity:1}100%{opacity:0}}.s1{animation:s1 16.0s ease-out infinite}@keyframes s2{0%,15.00%{opacity:0}17.19%,93.75%{opacity:1}100%{opacity:0}}.s2{animation:s2 16.0s ease-out infinite}@keyframes s3{0%,20.62%{opacity:0}22.81%,93.75%{opacity:1}100%{opacity:0}}.s3{animation:s3 16.0s ease-out infinite}@keyframes s4{0%,26.25%{opacity:0}28.44%,93.75%{opacity:1}100%{opacity:0}}.s4{animation:s4 16.0s ease-out infinite}@keyframes s5{0%,31.87%{opacity:0}34.06%,93.75%{opacity:1}100%{opacity:0}}.s5{animation:s5 16.0s ease-out infinite}@keyframes s6{0%,37.50%{opacity:0}39.69%,93.75%{opacity:1}100%{opacity:0}}.s6{animation:s6 16.0s ease-out infinite}@keyframes s7{0%,43.12%{opacity:0}45.31%,93.75%{opacity:1}100%{opacity:0}}.s7{animation:s7 16.0s ease-out infinite}@keyframes s8{0%,48.75%{opacity:0}50.94%,93.75%{opacity:1}100%{opacity:0}}.s8{animation:s8 16.0s ease-out infinite}@keyframes s9{0%,54.37%{opacity:0}56.56%,93.75%{opacity:1}100%{opacity:0}}.s9{animation:s9 16.0s ease-out infinite}@keyframes s10{0%,60.00%{opacity:0}62.19%,93.75%{opacity:1}100%{opacity:0}}.s10{animation:s10 16.0s ease-out infinite}@keyframes s11{0%,65.62%{opacity:0}67.81%,93.75%{opacity:1}100%{opacity:0}}.s11{animation:s11 16.0s ease-out infinite}
</style></defs>
<rect width="1000" height="640" rx="22" fill="#ffffff"/><rect x="1" y="1" width="998" height="638" rx="21" fill="none" stroke="#e2e8f0"/>
<text x="40" y="50" class="h1">One request, end to end</text>
<text x="40" y="74" class="sub">You ask in Kiro; the parent agent delegates; you see progress, answer its question, and get the result.</text>
<g transform="translate(640 44)" class="lg"><line x1="0" y1="0" x2="26" y2="0" stroke="#7c3aed" stroke-width="2.5"/><text x="32" y="4">request</text><line x1="104" y1="0" x2="130" y2="0" stroke="#0d9488" stroke-width="2.5" stroke-dasharray="7 5"/><text x="136" y="4">streamed back</text><line x1="236" y1="0" x2="262" y2="0" stroke="#d97706" stroke-width="2.5" stroke-dasharray="7 5"/><text x="268" y="4">question</text></g><rect x="57" y="92" width="156" height="42" rx="12" fill="#ffffff" stroke="#c4b5fd"/><text x="135" y="119" text-anchor="middle" class="who" style="fill:#0f172a">Kiro</text><line x1="135" y1="134" x2="135" y2="610" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="2 6"/><rect x="307" y="92" width="156" height="42" rx="12" fill="#7c3aed" stroke="#7c3aed"/><text x="385" y="119" text-anchor="middle" class="who" style="fill:#ffffff">kiro-a2a</text><line x1="385" y1="134" x2="385" y2="610" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="2 6"/><rect x="557" y="92" width="156" height="42" rx="12" fill="#ffffff" stroke="#5eead4"/><text x="635" y="119" text-anchor="middle" class="who" style="fill:#0f172a">orchestrator</text><line x1="635" y1="134" x2="635" y2="610" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="2 6"/><rect x="807" y="92" width="156" height="42" rx="12" fill="#f0fdfa" stroke="#99f6e4"/><text x="885" y="119" text-anchor="middle" class="who" style="fill:#0f172a">sub-agent</text><line x1="885" y1="134" x2="885" y2="610" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="2 6"/><g class="s0"><line x1="143" y1="168" x2="375" y2="168" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#mreq)"/><text x="157" y="160" class="m" style="fill:#7c3aed">tools/call ask_orchestrator(&quot;…&quot;)</text><circle cx="104" cy="168" r="11" fill="#7c3aed"/><text x="104" y="172" text-anchor="middle" class="n">1</text></g><g class="s1"><line x1="393" y1="204" x2="625" y2="204" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#mreq)"/><text x="407" y="196" class="m" style="fill:#7c3aed">sign in (OAuth) · SendStreamingMessage</text></g><g class="s2"><line x1="643" y1="240" x2="875" y2="240" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#mreq)"/><text x="657" y="232" class="m" style="fill:#7c3aed">SendMessage over A2A</text></g><g class="s3"><line x1="877" y1="276" x2="645" y2="276" stroke="#0d9488" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#mback)"/><text x="659" y="268" class="m" style="fill:#0d9488">progress + answer</text></g><g class="s4"><line x1="627" y1="312" x2="395" y2="312" stroke="#0d9488" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#mback)"/><text x="409" y="304" class="m" style="fill:#0d9488">working updates (streamed)</text></g><g class="s5"><line x1="377" y1="348" x2="145" y2="348" stroke="#0d9488" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#mback)"/><text x="159" y="340" class="m" style="fill:#0d9488">live progress in the chat</text><circle cx="104" cy="348" r="11" fill="#0d9488"/><text x="104" y="352" text-anchor="middle" class="n">2</text></g><g class="s6"><line x1="627" y1="384" x2="395" y2="384" stroke="#d97706" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#mask)"/><text x="409" y="376" class="m" style="fill:#d97706">input-required: &quot;Which numbers?&quot;</text></g><g class="s7"><line x1="377" y1="420" x2="145" y2="420" stroke="#d97706" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#mask)"/><text x="159" y="412" class="m" style="fill:#d97706">Kiro asks you the question</text><circle cx="104" cy="420" r="11" fill="#d97706"/><text x="104" y="424" text-anchor="middle" class="n">3</text></g><g class="s8"><line x1="143" y1="456" x2="375" y2="456" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#mreq)"/><text x="157" y="448" class="m" style="fill:#7c3aed">your answer, same task_id</text><circle cx="104" cy="456" r="11" fill="#7c3aed"/><text x="104" y="460" text-anchor="middle" class="n">4</text></g><g class="s9"><line x1="393" y1="492" x2="625" y2="492" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#mreq)"/><text x="407" y="484" class="m" style="fill:#7c3aed">resume the task</text></g><g class="s10"><line x1="627" y1="528" x2="395" y2="528" stroke="#0d9488" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#mback)"/><text x="409" y="520" class="m" style="fill:#0d9488">completed</text></g><g class="s11"><line x1="377" y1="564" x2="145" y2="564" stroke="#0d9488" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#mback)"/><text x="159" y="556" class="m" style="fill:#0d9488">answer + context_id for follow-ups</text><circle cx="104" cy="564" r="11" fill="#0d9488"/><text x="104" y="568" text-anchor="middle" class="n">5</text></g>
</svg>
